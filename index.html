<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>制造业商会 - 数字化运营赋能平台</title>
<style>
:root {
  --color-primary: #165DFF;
  --color-primary-light: #E8F0FF;
  --color-primary-dark: #0E42B3;
  --color-orange: #FF7D00;
  --color-bg: #F5F7FA;
  --color-border: #E5E6EB;
  --color-dark: #1D2129;
  --color-gray: #4E5969;
}

*,:after,:before{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{margin:0;padding:0;font-family:'Inter','PingFang SC','Microsoft YaHei',Helvetica Neue,Arial,sans-serif;color:var(--color-dark);background:var(--color-bg)}

/* 顶部固定导航 */
.fixed-nav{position:fixed;top:0;left:0;right:0;z-index:9999;height:56px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--color-border);transition:all .3s}
.fixed-nav-inner{max-width:80rem;margin:0 auto;height:100%;display:flex;align-items:center;padding:0 20px;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fixed-nav-inner::-webkit-scrollbar{height:0}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-right:24px;text-decoration:none;cursor:pointer}
.brand-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--color-primary),#4080FF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;box-shadow:0 2px 8px rgba(22,93,255,.3);flex-shrink:0}
.brand-text{font-weight:800;color:var(--color-dark);font-size:16px;line-height:1.2;white-space:nowrap}
.brand-sub{font-size:10px;color:var(--color-gray);white-space:nowrap}
.nav-tab{padding:8px 16px;border-radius:8px;border:none;background:transparent;font-size:14px;font-weight:500;color:var(--color-gray);cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit;flex-shrink:0;text-decoration:none}
.nav-tab:hover{color:var(--color-primary);background:var(--color-primary-light)}
.nav-tab.active{color:#fff;background:linear-gradient(135deg,var(--color-primary),#4080FF);box-shadow:0 2px 8px rgba(22,93,255,.25);font-weight:600}

/* iframe 容器 */
.iframe-container{position:fixed;top:56px;left:0;right:0;bottom:0;background:#fff;overflow:hidden;transition:top .3s}
.iframe-container iframe{width:100%;height:100%;border:none;display:block}

/* Loading 状态 */
.loading{position:fixed;top:56px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#070b16 0%,#0c1430 50%,#0a1426 100%);z-index:999;transition:opacity .3s}
.loading.hidden{opacity:0;pointer-events:none}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--color-primary);border-radius:50%;animation:spin .8s linear infinite}
.loading-text{position:absolute;bottom:40%;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font-size:13px;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="fixed-nav" id="fixedNav">
  <div class="fixed-nav-inner">
    <a class="brand" href="#" onclick="switchToPage('home');return false;">
      <div class="brand-icon">智</div>
      <div>
        <div class="brand-text">制造业商会</div>
        <div class="brand-sub">数字化运营赋能平台</div>
      </div>
    </a>
    <button class="nav-tab" data-page="home">首页</button>
    <button class="nav-tab" data-page="admin">管理端</button>
    <button class="nav-tab" data-page="employee">员工端</button>
  </div>
</nav>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">系统加载中...</div>
</div>

<div class="iframe-container" id="iframeContainer">
  <iframe id="mainFrame" title="制造业商会门户"></iframe>
</div>

// ============ 页面别名映射 ============
var PAGE_ALIASES = {"home.html":"home","admin.html":"admin","datav.html":"admin","employee.html":"employee","workbench.html":"employee","employee/production.html":"employee/production","production.html":"employee/production","workbench/production.html":"employee/production","employee/quality.html":"employee/quality","quality.html":"employee/quality","workbench/quality.html":"employee/quality","employee/equipment.html":"employee/equipment","equipment.html":"employee/equipment","workbench/equipment.html":"employee/equipment","employee/andon.html":"employee/andon","andon.html":"employee/andon","workbench/andon.html":"employee/andon","employee/performance.html":"employee/performance","performance.html":"employee/performance","workbench/performance.html":"employee/performance","employee/training.html":"employee/training","training.html":"employee/training","workbench/reports.html":"employee/training","reports.html":"employee/training","employee/attendance.html":"employee/attendance","attendance.html":"employee/attendance"};

// ============ Top Tab 映射 ============
var TOP_TAB_MAP = {"home":"home","admin":"admin","employee":"employee","employee/production":"employee","employee/quality":"employee","employee/equipment":"employee","employee/andon":"employee","employee/performance":"employee","employee/training":"employee"};

// ============ Blob URL 缓存 ============
var blobCache = {};

function getBlobUrl(pageId) {
  if (blobCache[pageId]) return blobCache[pageId];
  var b64 = PAGES_B64[pageId];
  if (!b64) return null;
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var blob = new Blob([bytes], {type: 'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  blobCache[pageId] = url;
  return url;
}

// ============ 解析 href → pageId ============
function resolveHref(href) {
  var path = href.split('?')[0].split('#')[0];
  path = path.replace(/^\.\//, '');
  if (PAGES_B64[path]) return path;
  if (PAGE_ALIASES[path]) return PAGE_ALIASES[path];
  if (path === '../index.html' || path === 'index.html') return 'home';
  if (path === '../employee.html') return 'employee';
  if (path === '../workbench.html') return 'employee';
  if (PAGES_B64['employee/' + path.replace(/\.html$/, '')]) return 'employee/' + path.replace(/\.html$/, '');
  if (PAGES_B64['workbench/' + path.replace(/\.html$/, '')]) return 'employee/' + path.replace(/\.html$/, '');
  for (var key in PAGES_B64) {
    if (key + '.html' === path) return key;
  }
  return null;
}

// ============ 判断是否需要隐藏顶部导航 ============
function isFullScreenPage(pageId) {
  // 管理端和员工端都有自己的 topbar，隐藏外部导航
  return pageId && (pageId.indexOf('admin') === 0 || pageId.indexOf('employee') === 0);
}

// ============ 应用顶部导航显隐 ============
function applyTopNavFor(pageId) {
  var nav = document.getElementById('fixedNav');
  var container = document.getElementById('iframeContainer');
  var loading = document.getElementById('loading');
  if (isFullScreenPage(pageId)) {
    nav.style.transform = 'translateY(-100%)';
    container.style.top = '0';
    loading.style.top = '0';
  } else {
    nav.style.transform = 'translateY(0)';
    container.style.top = '56px';
    loading.style.top = '56px';
  }
}

// ============ 高亮顶部标签 ============
function highlightTopTab(pageId) {
  var topTab = TOP_TAB_MAP[pageId];
  var tabs = document.querySelectorAll('.nav-tab');
  tabs.forEach(function(t) {
    if (t.dataset.page === topTab) t.classList.add('active');
    else t.classList.remove('active');
  });
}

// ============ 切换到指定页面 ============
function switchToPage(pageId) {
  var iframe = document.getElementById('mainFrame');
  var loading = document.getElementById('loading');

  var url = getBlobUrl(pageId);
  if (!url) {
    console.error('Page not found:', pageId);
    return;
  }

  loading.classList.remove('hidden');
  applyTopNavFor(pageId);
  highlightTopTab(pageId);

  iframe.src = url;

  if (history.pushState) {
    history.pushState({pageId: pageId}, '', '#' + pageId);
  }
}

// ============ 顶部 Tab 点击 ============
document.querySelectorAll('.nav-tab').forEach(function(tab) {
  tab.addEventListener('click', function(e) {
    e.preventDefault();
    switchToPage(this.dataset.page);
  });
});

// ============ iframe 加载完成 ============
document.getElementById('mainFrame').addEventListener('load', function() {
  document.getElementById('loading').classList.add('hidden');
});

// ============ 监听 iframe 内部导航请求 ============
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'nav') {
    var pageId = resolveHref(e.data.href);
    if (pageId) {
      switchToPage(pageId);
    }
  }
});

// ============ 浏览器后退/前进 ============
window.addEventListener('popstate', function(e) {
  if (e.state && e.state.pageId) {
    switchToPage(e.state.pageId);
  } else {
    switchToPage('home');
  }
});

// ============ 初始加载 ============
(function init() {
  // 创建所有 blob URL（预加载）
  for (var key in PAGES_B64) {
    getBlobUrl(key);
  }

  var hash = window.location.hash.replace('#', '').split('?')[0];
  var initPage = null;

  if (hash && PAGES_B64[hash]) {
    initPage = hash;
  }

  if (!initPage) {
    initPage = 'home';
  }

  switchToPage(initPage);

  // 初始隐藏 loading
  setTimeout(function() {
    document.getElementById('loading').classList.add('hidden');
  }, 800);
})();
</script>
